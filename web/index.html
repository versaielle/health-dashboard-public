<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="Health Stack"/>
  <meta name="theme-color" content="#0f0f0f"/>
  <title>Elite Health Stack</title>
<link rel="manifest" href="manifest.json"/>
  <link rel="apple-touch-icon" href="icon-192.png"/>
  <link rel="stylesheet" href="css/styles.css"/>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  <div id="login-screen">
    <div class="login-card">
      <div class="login-logo">⚡</div>
      <div class="login-title">Elite Health Stack</div>
      <div class="login-sub">Sign in to continue</div>
      <div id="g_id_signin"></div>
      <div class="login-error" id="login-error"></div>
    </div>
  </div>
  <div class="topbar">
    <div>
      <div class="topbar-title">Elite Health Stack</div>
      <div class="topbar-sub" id="topbar-date"></div>
    </div>
    <button class="hamburger" onclick="openSettings()" aria-label="Settings">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>
  </div>
  <div id="ptr">
    <div id="ptr-inner">
      <svg id="ptr-arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="12" y1="5" x2="12" y2="19"/><polyline points="19 12 12 19 5 12"/>
      </svg>
      <svg id="ptr-spin" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
        <path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/>
      </svg>
      <span id="ptr-text">Pull to refresh</span>
    </div>
  </div>
  <div class="content" id="content"></div>
  <div class="settings-overlay" id="settings-overlay">
    <div class="settings-header">
      <div class="settings-header-title">Settings</div>
      <button class="settings-close" onclick="closeSettings()" aria-label="Close">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="settings-body"></div>
  </div>
  <div id="weekly-drawer" class="weekly-drawer"></div>
  <div id="water-drawer" class="water-drawer"></div>
  <nav class="tabs">
    <button class="tab active" onclick="setTab('day')" id="tab-day">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>Day
    </button>
    <button class="tab" onclick="setTab('macros')" id="tab-macros">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>Macros
    </button>
    <button class="tab" onclick="setTab('grocery')" id="tab-grocery">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/></svg>Grocery
    </button>
    <button class="tab" onclick="setTab('recipes')" id="tab-recipes">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/><line x1="9" y1="12" x2="15" y2="12"/><line x1="9" y1="16" x2="13" y2="16"/></svg>Recipes
    </button>
  </nav>
  <script src="js/config.js"></script>
  <script src="js/state.js"></script>
  <script src="js/stack.js"></script>
  <script src="js/calendar.js"></script>
  <script src="js/render.js"></script>
  <script src="js/grocery.js"></script>
  <script src="js/recipes.js"></script>
  <script src="js/nutrition.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
